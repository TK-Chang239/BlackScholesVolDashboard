name: daily

# 17 2 * * 2-6 UTC ~= 22:17 ET Mon-Fri (21:17 under EST): after the US close
# and after EOD data settles. Tue-Sat in UTC covers Mon-Fri US sessions (SPEC
# 2.1). Running earlier is not an option -- the session date comes from the
# latest EOD bar, so firing before that bar publishes would label the chain
# with the wrong session.
#
# The odd minute is deliberate. GitHub does not promise punctuality and delays
# scheduled runs most at :00 and :30; run 33477912528 was dispatched five
# hours after its old 01:30 slot, landing at 02:30 ET where the book is shut
# and the fetch comes back thin. That is a smaller target, not a guarantee, so
# run_daily also triages a late run rather than failing red (see
# `book_should_be_full`).
on:
  schedule:
    - cron: "17 2 * * 2-6"
  workflow_dispatch:

# A run commits to main. Never let two runs race for the same push, and never
# cancel one midway -- a cancelled job could leave the repo half-updated.
concurrency:
  group: daily-publish
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # run_daily sets no explicit network request timeout, so a stuck fetch could
    # otherwise run for GitHub's 6-hour job default. Because cancel-in-progress
    # is false above, that would hold the daily-publish concurrency group for
    # the full 6 hours, blocking every later scheduled run AND any manual
    # recovery dispatch queued behind it. A normal run (install, test, fetch,
    # render, commit) takes a few minutes; 30 gives generous headroom above
    # that while still failing fast enough for same-day manual recovery.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # SPEC 4: a broken model never publishes. This runs BEFORE the pipeline,
      # and a failure here stops the job with nothing written.
      - name: Run tests
        run: pytest -q

      # SPEC 2.1 failure policy: run_daily computes everything before it writes
      # anything and raises on failure, so a non-zero exit here simply leaves
      # yesterday's dashboard live. Do not wrap this in error handling.
      #
      # It has one clean exit that publishes nothing: a retention refusal while
      # the book was shut, which means the job ran when there was nothing to
      # fetch rather than that anything broke. It says so on `published`.
      - name: Run the daily pipeline
        id: pipeline
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python -m src.run_daily

      # Gate on the pipeline saying it published, not on the working tree being
      # dirty: an off-hours refusal exits 0 (it is not a defect) but `run` has
      # already upserted the underlying bars by then, so a dirty-tree check
      # would commit a "daily snapshot" containing no snapshot.
      - name: Commit the new snapshot
        if: steps.pipeline.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "nothing changed - not committing"
            exit 0
          fi
          git commit -m "chore: daily snapshot $(date -u +%Y-%m-%d) [skip ci]"
          git push
